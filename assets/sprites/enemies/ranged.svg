<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Ranged Enemy - Orange Shooter -->
  <!-- Head -->
  <rect x="11" y="4" width="10" height="8" fill="#e67e22"/>
  <rect x="9" y="6" width="14" height="4" fill="#e67e22"/>
  <!-- Eyes -->
  <rect x="13" y="6" width="2" height="2" fill="white"/>
  <rect x="17" y="6" width="2" height="2" fill="white"/>
  <rect x="14" y="7" width="1" height="1" fill="#2c3e50"/>
  <rect x="18" y="7" width="1" height="1" fill="#2c3e50"/>
  <!-- Hood -->
  <rect x="10" y="2" width="12" height="4" fill="#d35400"/>
  <!-- Body -->
  <rect x="10" y="12" width="12" height="10" fill="#d35400"/>
  <rect x="8" y="14" width="16" height="6" fill="#d35400"/>
  <!-- Arms -->
  <rect x="6" y="14" width="4" height="4" fill="#e67e22"/>
  <rect x="22" y="14" width="4" height="4" fill="#e67e22"/>
  <!-- Bow -->
  <rect x="24" y="10" width="2" height="12" fill="#8b4513"/>
  <rect x="22" y="12" width="4" height="2" fill="#a0522d"/>
  <rect x="22" y="18" width="4" height="2" fill="#a0522d"/>
  <!-- Arrow -->
  <rect x="26" y="14" width="4" height="1" fill="#7f8c8d"/>
  <rect x="29" y="13" width="2" height="3" fill="#f1c40f"/>
  <!-- Legs -->
  <rect x="10" y="22" width="4" height="6" fill="#a04000"/>
  <rect x="18" y="22" width="4" height="6" fill="#a04000"/>
  <!-- Feet -->
  <rect x="8" y="28" width="6" height="2" fill="#a04000"/>
  <rect x="18" y="28" width="6" height="2" fill="#a04000"/>
</svg>
