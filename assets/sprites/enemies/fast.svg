<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Fast Enemy - Green Imp -->
  <!-- Head -->
  <rect x="8" y="3" width="8" height="6" fill="#2ecc71"/>
  <rect x="6" y="5" width="12" height="3" fill="#2ecc71"/>
  <!-- Eyes -->
  <rect x="9" y="5" width="2" height="2" fill="white"/>
  <rect x="13" y="5" width="2" height="2" fill="white"/>
  <rect x="10" y="6" width="1" height="1" fill="#27ae60"/>
  <rect x="14" y="6" width="1" height="1" fill="#27ae60"/>
  <!-- Ears -->
  <rect x="5" y="3" width="3" height="3" fill="#2ecc71"/>
  <rect x="16" y="3" width="3" height="3" fill="#2ecc71"/>
  <!-- Body -->
  <rect x="7" y="9" width="10" height="7" fill="#27ae60"/>
  <rect x="5" y="11" width="14" height="4" fill="#27ae60"/>
  <!-- Arms -->
  <rect x="3" y="10" width="4" height="3" fill="#2ecc71"/>
  <rect x="17" y="10" width="4" height="3" fill="#2ecc71"/>
  <!-- Legs -->
  <rect x="7" y="16" width="3" height="4" fill="#1e8449"/>
  <rect x="14" y="16" width="3" height="4" fill="#1e8449"/>
  <!-- Feet -->
  <rect x="6" y="20" width="4" height="2" fill="#1e8449"/>
  <rect x="14" y="20" width="4" height="2" fill="#1e8449"/>
  <!-- Tail -->
  <rect x="18" y="12" width="4" height="2" fill="#2ecc71"/>
  <rect x="20" y="10" width="2" height="4" fill="#2ecc71"/>
</svg>
