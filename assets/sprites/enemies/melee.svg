  <!-- Legs -->
  <rect x="10" y="22" width="4" height="6" fill="#922b21"/>
  <rect x="18" y="22" width="4" height="6" fill="#922b21"/>
  <!-- Feet -->
  <rect x="8" y="28" width="6" height="2" fill="#922b21"/>
  <rect x="18" y="28" width="6" height="2" fill="#922b21"/>
</svg>
