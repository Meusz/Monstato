<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Melee Enemy - Red Goblin -->
  <!-- Head -->
  <rect x="11" y="4" width="10" height="8" fill="#e74c3c"/>
  <rect x="9" y="6" width="14" height="4" fill="#e74c3c"/>
  <!-- Eyes -->
  <rect x="13" y="6" width="2" height="2" fill="#f1c40f"/>
  <rect x="17" y="6" width="2" height="2" fill="#f1c40f"/>
  <rect x="14" y="7" width="1" height="1" fill="#2c3e50"/>
  <rect x="18" y="7" width="1" height="1" fill="#2c3e50"/>
  <!-- Ears -->
  <rect x="7" y="4" width="4" height="4" fill="#e74c3c"/>
  <rect x="21" y="4" width="4" height="4" fill="#e74c3c"/>
  <!-- Body -->
  <rect x="10" y="12" width="12" height="10" fill="#c0392b"/>
  <rect x="8" y="14" width="16" height="6" fill="#c0392b"/>
  <!-- Arms -->
  <rect x="6" y="14" width="4" height="4" fill="#e74c3c"/>
  <rect x="22" y="14" width="4" height="4" fill="#e74c3c"/>
